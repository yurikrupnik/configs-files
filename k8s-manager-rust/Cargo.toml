[package]
name = "k8s-manager-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# TUI Framework
ratatui = "0.29.0"
crossterm = "0.29"

# Web API
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Kubernetes
kube = { version = "2.0", features = ["runtime", "derive", "ws"] }
k8s-openapi = { version = "0.26", features = ["latest"] }

# Data Processing
polars = { version = "0.51.0", features = ["lazy", "temporal", "strings", "json", "parquet", "dtype-struct"] }

# Async & Utilities
tokio-tungstenite = "0.27"
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"

# WebSocket
tungstenite = "0.27"

# Configuration
config = "0.15"
toml = "0.9"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"

[[bin]]
name = "tui"
path = "src/bin/tui.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "manager"
path = "src/bin/manager.rs"