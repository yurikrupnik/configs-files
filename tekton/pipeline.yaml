apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: unified-test-pipeline
  namespace: tekton-pipelines
spec:
  params:
  - name: repo-url
    type: string
    description: The git repository URL to clone from.
  - name: revision
    type: string
    description: The git revision to checkout (branch, tag, sha, ref, etc...)
    default: main
  
  workspaces:
  - name: shared-data
    description: |
      This workspace contains the cloned repo files, so they can be read by the
      next task.
  - name: git-credentials
    description: Workspace for git credentials
    optional: true

  tasks:
  - name: fetch-source
    taskRef:
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-data
    - name: basic-auth
      workspace: git-credentials
    params:
    - name: url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)

  - name: install-dependencies
    runAfter: ["fetch-source"]
    taskSpec:
      workspaces:
      - name: source
      steps:
      - name: setup-tools
        image: registry.access.redhat.com/ubi8/ubi:latest
        workingDir: $(workspaces.source.path)
        script: |
          #!/bin/bash
          set -e
          
          echo "=== Installing required tools ==="
          
          # Install Node.js
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          yum install -y nodejs
          
          # Install Rust
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
          
          # Install Go
          GO_VERSION=1.21.0
          wget -q https://golang.org/dl/go${GO_VERSION}.linux-amd64.tar.gz
          tar -C /usr/local -xzf go${GO_VERSION}.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          
          # Install Python and pip
          yum install -y python3 python3-pip
          pip3 install pytest
          
          # Install Bun
          curl -fsSL https://bun.sh/install | bash
          source ~/.bashrc
          
          # Install KCL
          curl -fsSL https://kcl-lang.io/script/install.sh | /bin/bash
          export PATH=$HOME/.kclvm/bin:$PATH
          
          echo "=== Tool installation complete ==="
      
      - name: install-project-deps
        image: registry.access.redhat.com/ubi8/ubi:latest
        workingDir: $(workspaces.source.path)
        script: |
          #!/bin/bash
          set -e
          
          # Add tools to PATH
          export PATH=$PATH:/usr/local/go/bin:$HOME/.cargo/bin:$HOME/.bun/bin:$HOME/.kclvm/bin
          
          echo "=== Installing project dependencies ==="
          
          # Install Node.js dependencies
          find . -name "package.json" -not -path "./node_modules/*" -exec dirname {} \; | while read dir; do
            echo "Installing dependencies in $dir"
            cd "$dir"
            if [ -f "package-lock.json" ]; then
              npm ci
            elif [ -f "bun.lockb" ]; then
              bun install
            else
              npm install
            fi
            cd "$(workspaces.source.path)"
          done
          
          # Check Rust dependencies
          find . -name "Cargo.toml" -not -path "./target/*" -exec dirname {} \; | while read dir; do
            echo "Checking Rust project in $dir"
            cd "$dir"
            cargo check
            cd "$(workspaces.source.path)"
          done
          
          echo "=== Dependencies installation complete ==="
    workspaces:
    - name: source
      workspace: shared-data

  - name: run-tests
    runAfter: ["install-dependencies"]
    taskSpec:
      workspaces:
      - name: source
      results:
      - name: test-result
        description: Test execution result
      steps:
      - name: execute-tests
        image: registry.access.redhat.com/ubi8/ubi:latest
        workingDir: $(workspaces.source.path)
        script: |
          #!/bin/bash
          set -e
          
          # Add tools to PATH
          export PATH=$PATH:/usr/local/go/bin:$HOME/.cargo/bin:$HOME/.bun/bin:$HOME/.kclvm/bin
          
          echo "=== Running unified test suite ==="
          
          # Make the test runner executable
          chmod +x ./scripts/test-runner.sh
          
          # Run the test runner
          if ./scripts/test-runner.sh; then
            echo "SUCCESS" | tee $(results.test-result.path)
          else
            echo "FAILED" | tee $(results.test-result.path)
            exit 1
          fi
    workspaces:
    - name: source
      workspace: shared-data

  - name: lint-and-format
    runAfter: ["fetch-source"]
    taskSpec:
      workspaces:
      - name: source
      steps:
      - name: run-linters
        image: registry.access.redhat.com/ubi8/ubi:latest
        workingDir: $(workspaces.source.path)
        script: |
          #!/bin/bash
          set -e
          
          # Add tools to PATH
          export PATH=$PATH:/usr/local/go/bin:$HOME/.cargo/bin
          
          echo "=== Running linters and format checks ==="
          
          # Node.js projects
          find . -name "package.json" -not -path "./node_modules/*" -exec dirname {} \; | while read dir; do
            cd "$dir"
            if [ -f "package.json" ] && grep -q '"lint"' package.json; then
              npm run lint || echo "Linting failed for $dir"
            fi
            cd "$(workspaces.source.path)"
          done
          
          # Rust projects
          find . -name "Cargo.toml" -not -path "./target/*" -exec dirname {} \; | while read dir; do
            cd "$dir"
            cargo fmt --check || echo "Rust formatting check failed for $dir"
            cargo clippy -- -D warnings || echo "Clippy failed for $dir"
            cd "$(workspaces.source.path)"
          done
          
          echo "=== Linting complete ==="
    workspaces:
    - name: source
      workspace: shared-data

  - name: build-projects
    runAfter: ["run-tests", "lint-and-format"]
    when:
    - input: "$(params.revision)"
      operator: in
      values: ["main", "master"]
    taskSpec:
      workspaces:
      - name: source
      steps:
      - name: build-all
        image: registry.access.redhat.com/ubi8/ubi:latest
        workingDir: $(workspaces.source.path)
        script: |
          #!/bin/bash
          set -e
          
          # Add tools to PATH
          export PATH=$PATH:/usr/local/go/bin:$HOME/.cargo/bin
          
          echo "=== Building all projects ==="
          
          # Node.js builds
          find . -name "package.json" -not -path "./node_modules/*" -exec dirname {} \; | while read dir; do
            cd "$dir"
            if grep -q '"build"' package.json; then
              npm run build || echo "Build failed for $dir"
            fi
            cd "$(workspaces.source.path)"
          done
          
          # Rust builds
          find . -name "Cargo.toml" -not -path "./target/*" -exec dirname {} \; | while read dir; do
            cd "$dir"
            cargo build --release || echo "Rust build failed for $dir"
            cd "$(workspaces.source.path)"
          done
          
          echo "=== Build complete ==="
    workspaces:
    - name: source
      workspace: shared-data

---
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: unified-test-pipeline-run
  namespace: tekton-pipelines
spec:
  pipelineRef:
    name: unified-test-pipeline
  workspaces:
  - name: shared-data
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  params:
  - name: repo-url
    value: https://github.com/your-username/your-repo.git
  - name: revision
    value: main
